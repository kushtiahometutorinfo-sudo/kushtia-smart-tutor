<style>
  :root{
    --green-dark:#0f6b3a;
    --green-mid:#1e9e52;
    --green-light:#6fd07f;
    --green-pale:#eafaf0;
    --bg:#f6f9f4;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI', 'Noto Sans Bengali', Arial, sans-serif;
    background:radial-gradient(circle at 50% 20%, #ffffff 0%, var(--bg) 60%, #eef6ee 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
    position:relative;
  }

  /* soft floating background blobs */
  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.35;
    animation:float 8s ease-in-out infinite;
  }
  .blob1{
    width:280px;height:280px;
    background:var(--green-light);
    top:-80px; left:-80px;
    animation-delay:0s;
  }
  .blob2{
    width:320px;height:320px;
    background:var(--green-mid);
    bottom:-100px; right:-100px;
    animation-delay:2s;
  }
  @keyframes float{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-25px) scale(1.05);}
  }

  .loader-wrap{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:2;
    padding:20px;
  }

  .ring-box{
    position:relative;
    width:180px;
    height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:34px;
  }

  .ring-box svg{
    position:absolute;
    top:0;left:0;
    width:180px;
    height:180px;
    transform:rotate(-90deg);
  }

  .ring-bg{
    fill:none;
    stroke:#dcefe0;
    stroke-width:6;
  }

  .ring-progress{
    fill:none;
    stroke:url(#ringGradient);
    stroke-width:6;
    stroke-linecap:round;
    stroke-dasharray:502.4;
    stroke-dashoffset:502.4;
    animation:ringFill 2.6s cubic-bezier(.65,0,.35,1) forwards;
  }

  @keyframes ringFill{
    to{stroke-dashoffset:40;}
  }

  .logo-circle{
    width:128px;
    height:128px;
    border-radius:50%;
    background:#ffffff;
    box-shadow:0 8px 24px rgba(15,107,58,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    animation:pulse 2.2s ease-in-out infinite;
    z-index:2;
  }

  .logo-circle img{
    width:82%;
    height:82%;
    object-fit:contain;
    animation:breathe 2.2s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{box-shadow:0 8px 24px rgba(15,107,58,0.18);}
    50%{box-shadow:0 8px 34px rgba(15,107,58,0.32);}
  }
  @keyframes breathe{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
  }

  .brand-name{
    font-size:26px;
    font-weight:800;
    background:linear-gradient(90deg,var(--green-dark),var(--green-mid));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:0.5px;
    text-align:center;
    animation:fadeUp 0.8s ease 0.2s both;
  }

  .brand-tagline{
    margin-top:6px;
    font-size:14px;
    color:#4d7a5a;
    text-align:center;
    animation:fadeUp 0.8s ease 0.4s both;
  }

  .dots{
    margin-top:22px;
    display:flex;
    gap:8px;
    animation:fadeUp 0.8s ease 0.6s both;
  }
  .dots span{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--green-mid);
    animation:bounce 1.2s ease-in-out infinite;
  }
  .dots span:nth-child(2){animation-delay:0.15s; background:var(--green-dark);}
  .dots span:nth-child(3){animation-delay:0.3s; background:var(--green-light);}

  @keyframes bounce{
    0%,80%,100%{transform:translateY(0); opacity:0.5;}
    40%{transform:translateY(-10px); opacity:1;}
  }

  @keyframes fadeUp{
    from{opacity:0; transform:translateY(12px);}
    to{opacity:1; transform:translateY(0);}
  }

  .loading-text{
    margin-top:16px;
    font-size:13px;
    color:#7a9b85;
    letter-spacing:0.3px;
    animation:fadeUp 0.8s ease 0.7s both;
  }

  .skip-link{
    position:absolute;
    bottom:24px;
    font-size:12px;
    color:#9db8a6;
    text-decoration:none;
    z-index:2;
    animation:fadeUp 0.8s ease 1s both;
  }
  .skip-link a{
    color:var(--green-dark);
    text-decoration:underline;
    font-weight:600;
  }
</style>
</head>
